[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nilm-11class-clean"
version = "0.1.0"
description = "Leakage-safe 11-class PLAID appliance image classification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=1.5",
  "Pillow>=9.1",
  "scikit-learn>=1.0",
  "torch>=2.0",
  "torchvision>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]
